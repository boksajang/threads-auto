name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      THREADS_AUTO_DAILY_QUALITY_TEST: '0'
      LIVE_AFFILIATE_PREVIEW: '0'
      CONTENT_PREVIEW_DIR: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm run setup
      - run: npm run check
      - run: npm run make
